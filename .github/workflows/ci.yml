name: ci
on: [push, pull_request]

jobs:
  process-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: SANDBOX_BACKEND=process python -m unittest discover -s tests -t . -v

  docker-backend:
    runs-on: ubuntu-latest        # GitHub-hosted runners ship with a Docker daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: docker build -f docker/runner.Dockerfile -t airlock-runner:latest .
      - run: SANDBOX_BACKEND=docker python -m unittest discover -s tests -t . -v
      - name: Containment report
        run: SANDBOX_BACKEND=docker python -m scripts.containment_report | tee containment.md
      - uses: actions/upload-artifact@v4
        with: { name: containment-report, path: containment.md }
